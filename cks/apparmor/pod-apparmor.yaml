---
apiVersion: v1
kind: Pod
metadata:
  name: pod-apparmor
spec:
  nodeSelector:
    security.4linux/apparmor: deny-write
  securityContext:
    appArmorProfile:
      type: Localhost
      localhostProfile: k8s-apparmor-deny-write
  containers:
  - name: app
    image: busybox:1.36.1
    command:
    - sh
    - -c
    - sleep 86400
