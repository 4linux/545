---
apiVersion: v1
kind: Pod
metadata:
  name: pod-seccomp-runtime-default
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: busybox:1.36.1
    command:
    - sh
    - -c
    - sleep 86400
    securityContext:
      allowPrivilegeEscalation: false
