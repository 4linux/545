customRules:
  cks-rules.yaml: |-
    - rule: CKS Custom Command Detected
      desc: Detecta a execução do comando utilizado no laboratório CKS
      condition: >
        spawned_process and
        container and
        proc.cmdline contains "cks-custom-rule"
      output: >
        Comando CKS detectado
        (user=%user.name
        command=%proc.cmdline
        container=%container.name
        pod=%k8s.pod.name
        namespace=%k8s.ns.name)
      priority: WARNING
      tags:
      - cks
      - container
      - process
