---
apiVersion: v1
kind: Pod
metadata:
  name: secret-env
  namespace: microservices-security
spec:
  containers:
  - name: app
    image: busybox:1.36.1
    command:
    - sh
    - -c
    - sleep 86400
    env:
    - name: MYSQL_PASSWORD
      valueFrom:
        secretKeyRef:
          name: mysql-secrets
          key: MYSQL_PASSWORD
