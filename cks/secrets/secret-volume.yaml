---
apiVersion: v1
kind: Pod
metadata:
  name: secret-volume
  namespace: microservices-security
spec:
  containers:
  - name: app
    image: busybox:1.36.1
    command:
    - sh
    - -c
    - sleep 86400
    volumeMounts:
    - name: credentials
      mountPath: /etc/mysql-secret
      readOnly: true
  volumes:
  - name: credentials
    secret:
      secretName: mysql-secrets
