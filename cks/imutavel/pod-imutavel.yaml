---
apiVersion: v1
kind: Pod
metadata:
  name: pod-imutavel
spec:
  containers:
  - name: apache
    image: httpd:2.4
    securityContext:
      readOnlyRootFilesystem: true
    volumeMounts:
    - name: apachelogs
      mountPath: /usr/local/apache2/logs
  volumes:
  - name: apachelogs
    emptyDir: {}
